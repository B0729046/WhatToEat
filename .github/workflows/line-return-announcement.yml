name: Send one-time LINE return announcement

on:
  workflow_dispatch:

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send return announcement
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          READY=false
          for ATTEMPT in $(seq 1 18); do
            DEPLOYED=$(curl --silent --show-error \
              "https://what-to-eat-chi-pink.vercel.app/api/deploy-version")
            if echo "$DEPLOYED" | grep --quiet "$GITHUB_SHA"; then
              READY=true
              break
            fi
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "::error title=Vercel deployment timeout::The production deployment did not reach $GITHUB_SHA"
            exit 1
          fi
          HTTP_CODE=$(curl --silent --show-error \
            --output response.json --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://what-to-eat-chi-pink.vercel.app/api/announce-return"
          )
          RESPONSE=$(cat response.json)
          echo "HTTP $HTTP_CODE: $RESPONSE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error title=LINE announcement failed::HTTP $HTTP_CODE: $RESPONSE"
            exit 1
          fi
