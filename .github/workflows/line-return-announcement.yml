name: Send one-time LINE return announcement

on:
  push:
    branches: [main]
    paths:
      - "api/announce-return.js"
      - ".github/workflows/line-return-announcement.yml"
  workflow_dispatch:

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Send return announcement
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          sleep 30
          curl --fail-with-body --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://what-to-eat-chi-pink.vercel.app/api/announce-return"
