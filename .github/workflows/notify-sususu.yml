name: Notify Sususu to test Android map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - api/notify-sususu.js
      - .github/workflows/notify-sususu.yml

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Sususu to test the map button
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          READY=false
          for ATTEMPT in $(seq 1 18); do
            DEPLOYED=$(curl --silent --show-error \
              "https://what-to-eat-chi-pink.vercel.app/api/deploy-version")
            if echo "$DEPLOYED" | grep --quiet "$GITHUB_SHA"; then
              READY=true
              break
            fi
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "::error title=Vercel deployment timeout::The production deployment did not reach $GITHUB_SHA"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://what-to-eat-chi-pink.vercel.app/api/notify-sususu"
