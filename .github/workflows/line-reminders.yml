name: LINE vote reminders

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "25 9 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send vote reminder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "25 9 * * *" ]; then
            PHASE="final"
          else
            PHASE="first"
          fi
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://what-to-eat-chi-pink.vercel.app/api/remind?phase=$PHASE"
